plugins {
    id 'com.android.application'
}

android {
    namespace 'com.escapeshadow.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.escapeshadow.game'
        minSdk 24
        targetSdk 34
        // رقم الإصدار يزداد تلقائيًا مع كل بناء على GitHub (-Pvc=...) كي يقبل أندرويد التحديث فوق النسخة القديمة
        versionCode (project.findProperty('vc') ?: '1').toInteger()
        versionName '1.0'
    }

    // مفتاح توقيع ثابت داخل المشروع: يضمن أن كل نسخة جديدة تُثبَّت فوق السابقة بدون حذفها
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
